# Brėžly: automatinis Brezly_Setup.exe surinkimas ir atnaujinimai - NEMOKAMAI (viešai GitHub repozitorijai).
#
# Kaip išleisti naują versiją (bet kuris būdas):
#   A) GitHub -> Actions -> „Brėžly diegimo programa“ -> Run workflow -> versija 0.9, kas naujo -> Run.
#   B) git tag -a v0.9 -m "Kas naujo..."  ir  git push origin v0.9
#   Po ~5 min. atsiras Release su Brezly_Setup.exe, Brezly_programa.zip ir atnaujinimai.json,
#   o visi įdiegti Brėžly patys pasiūlys atnaujinti.
# Bandomasis surinkimas be Release: Actions -> „Brėžly diegimo programa“ -> Run workflow.
name: Brėžly diegimo programa

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versija:
        description: "Versija be v, pvz. 0.9 (tuščia - tik bandomasis surinkimas be Release)"
        required: false
        default: ""
      pastabos:
        description: "Kas naujo (rodoma vartotojams atnaujinant)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: brezly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surinkti:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"          # lietuviškos raidės testų išvestyje
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versija ir atnaujinimų adresas
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } elseif ("${{ inputs.versija }}") { "v" + "${{ inputs.versija }}".Trim().TrimStart("v","V") } else { "" }
          $v = if ($tag) { $tag.TrimStart("v", "V") } else { "0.0.0-bandymas" }
          if ($tag -and $v -notmatch '^\d+(\.\d+)*$') { throw "Žyma turi būti kaip v0.9 arba v1.0.2 (dabar: $tag)" }
          Set-Content versija.txt $v -NoNewline -Encoding utf8
          # programa žinos, kur tikrinti atnaujinimus - nieko rankiniu būdu nustatyti nereikia
          Set-Content atnaujinimai_url.txt "https://github.com/${{ github.repository }}/releases/latest/download/atnaujinimai.json" -NoNewline -Encoding utf8
          "VERSIJA=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZYMA=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force isvestis | Out-Null

      - name: Paketai
        run: python -m pip install --upgrade pyinstaller pywin32

      - name: Testai (pamokos, praktika, serveris, programėlės tikrinimas, LISP)
        run: python -m unittest discover -s testai -v

      - name: Brezly.exe
        run: python irankiai/surinkti.py exe

      - name: Patikra - ar Brezly.exe pasileidžia
        shell: pwsh
        run: |
          $env:BREZLY_BE_LANGO = "1"
          $p = Start-Process dist\Brezly\Brezly.exe -PassThru
          Start-Sleep 8
          if ($p.HasExited) { Get-Content dist\Brezly\klaida.txt -ErrorAction SilentlyContinue; throw "Brezly.exe užsidarė iškart" }
          Stop-Process $p -Force
          # ar .exe viduje veikia pywin32 (be jo Brėžly neprisijungtų prie AutoCAD)
          $env:BREZLY_PATIKRA = "1"
          $p = Start-Process dist\Brezly\Brezly.exe -PassThru
          $null = $p.Handle            # kad ExitCode būtų žinomas ir greitai pasibaigus
          if (-not $p.WaitForExit(60000)) { Stop-Process $p -Force; throw "Brezly.exe patikra neatsakė" }
          Get-Content dist\Brezly\patikra.txt -ErrorAction SilentlyContinue
          Remove-Item dist\Brezly\patikra.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Brezly.exe viduje neveikia pywin32 (ryšys su AutoCAD)" }

      - name: Brezly_Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersija=$env:VERSIJA" diegimas\brezly.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup klaida" }

      - name: MSIX paketas Microsoft Store'ui
        shell: pwsh
        env:   # Partner Center -> Produkto tapatybė; nenustačius - bandomoji tapatybė
          MSIX_TAPATYBE: ${{ vars.MSIX_TAPATYBE }}
          MSIX_LEIDEJAS: ${{ vars.MSIX_LEIDEJAS }}
          MSIX_LEIDEJO_VARDAS: ${{ vars.MSIX_LEIDEJO_VARDAS }}
        run: |
          python -m pip install --upgrade pillow
          python irankiai/msix.py
          if ($LASTEXITCODE -ne 0) { throw "MSIX klaida" }

      - name: MSIX bandomasis (pasirašytas) ir patikra - įdiegiama ir paleidžiama čia pat
        shell: powershell      # Windows PowerShell: Appx komandos (pwsh 7 jų tiesiogiai neturi); tekstai be lietuviškų raidžių
        run: |
          $ns = @{ m = "http://schemas.microsoft.com/appx/manifest/foundation/windows10" }
          $id = (Select-Xml -Path dist\msix\AppxManifest.xml -Namespace $ns -XPath "/m:Package/m:Identity").Node
          $cert = New-SelfSignedCertificate -Type Custom -Subject $id.Publisher -KeyUsage DigitalSignature `
            -FriendlyName "Brezly bandomasis" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = "$env:RUNNER_TEMP\bandomasis.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString "brezly" -Force -AsPlainText) | Out-Null
          Export-Certificate -Cert $cert -FilePath isvestis\Brezly_bandomasis.cer | Out-Null
          Copy-Item isvestis\Brezly_Store.msix isvestis\Brezly_bandomasis.msix
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p brezly isvestis\Brezly_bandomasis.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool klaida" }
          Remove-Item $pfx
          Copy-Item diegimas\IDIEGTI_BANDOMAJI_MSIX.ps1 isvestis\
          # idiegiame ir paleidziame per brezly.exe alias: ar pakete veikia rysio su AutoCAD dalis
          Import-Certificate -FilePath isvestis\Brezly_bandomasis.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path (Resolve-Path isvestis\Brezly_bandomasis.msix).Path
          $pk = Get-AppxPackage -Name $id.Name
          "Idiegta: $($pk.PackageFullName)"
          $ataskaita = "$env:RUNNER_TEMP\msix_patikra.txt"
          $env:BREZLY_PATIKRA = $ataskaita
          Start-Process "$env:LOCALAPPDATA\Microsoft\WindowsApps\brezly.exe"
          for ($i = 0; $i -lt 90 -and -not (Test-Path $ataskaita); $i++) { Start-Sleep 1 }
          $t = if (Test-Path $ataskaita) { Get-Content $ataskaita -Raw } else { "(ataskaitos nera)" }
          $t
          Remove-AppxPackage $pk.PackageFullName
          if ($t -notmatch "pywin32: gerai") { throw "MSIX pakete neveikia pywin32 (rysys su AutoCAD)" }
          if ($t -notmatch "supakuota: taip") { throw "Brezly nesupranta, kad paleistas is MSIX (atnaujintu pats)" }
          if ("$env:MSIX_TAPATYBE_YRA" -ne "true") { "::warning::MSIX su bandomaja tapatybe - Store'ui nustatyk repo kintamuosius MSIX_TAPATYBE, MSIX_LEIDEJAS, MSIX_LEIDEJO_VARDAS" }
        env:
          MSIX_TAPATYBE_YRA: ${{ vars.MSIX_TAPATYBE != '' }}

      - name: Brezly_programa.zip (atnaujinimui be .exe) ir Brezly.lsp
        run: python irankiai/surinkti.py zip

      - name: atnaujinimai.json (su kontrolinėmis sumomis)
        shell: pwsh
        env:
          PASTABOS_IVESTOS: ${{ inputs.pastabos }}
        run: |
          # konkrečios versijos adresas (nekintantis); 1.5.1+ diegia tik iš .../releases/download/...
          $u = "https://github.com/${{ github.repository }}/releases/download/$env:ZYMA"
          $pastabos = "$env:PASTABOS_IVESTOS"
          if ("${{ github.ref_type }}" -eq "tag") { $pastabos = (git tag -l --format='%(contents)' "${{ github.ref_name }}" | Out-String) }
          if (-not $pastabos.Trim()) {                                    # iš naujienos.json
            python irankiai/naujienos.py "$env:VERSIJA" isvestis\naujiena.txt
            $pastabos = Get-Content isvestis\naujiena.txt -Raw -Encoding utf8
            if ($null -eq $pastabos) { $pastabos = "" }
          }
          $pastabos = $pastabos.Trim(); if (-not $pastabos) { $pastabos = "Nauja Brėžly versija $env:VERSIJA" }
          if ($pastabos.Length -gt 400) { $pastabos = $pastabos.Substring(0, 400) + "…" }
          [ordered]@{
            versija      = $env:VERSIJA
            setup        = "$u/Brezly_Setup.exe"
            setup_sha256 = (Get-FileHash isvestis\Brezly_Setup.exe -Algorithm SHA256).Hash.ToLower()
            zip          = "$u/Brezly_programa.zip"
            zip_sha256   = (Get-FileHash isvestis\Brezly_programa.zip -Algorithm SHA256).Hash.ToLower()
            pastabos     = $pastabos
          } | ConvertTo-Json | Set-Content isvestis\atnaujinimai.json -Encoding utf8
          Set-Content isvestis\pastabos.md $pastabos -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: Brezly_${{ env.VERSIJA }}
          path: isvestis/*

      - name: Sukurti Release ir prisegti failus
        if: env.ZYMA != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ZYMA }}
          target_commitish: ${{ github.sha }}
          name: Brėžly ${{ env.VERSIJA }}
          body_path: isvestis/pastabos.md
          make_latest: true
          files: |
            isvestis/Brezly_Setup.exe
            isvestis/Brezly_programa.zip
            isvestis/atnaujinimai.json
            isvestis/Brezly.lsp
            isvestis/Brezly.txt
